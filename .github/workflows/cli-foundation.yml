name: CLI foundation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install application and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile application
        run: python -m compileall -q oci_platform oci_free_watch.py

      - name: Validate Linux installer syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Verify wheel contains the packaged setup template
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(wheel).namelist(); assert 'oci_platform/templates/config.example.json' in names, names"

      - name: Verify CLI entry point
        run: |
          oci-platform --help
          oci-platform --version
