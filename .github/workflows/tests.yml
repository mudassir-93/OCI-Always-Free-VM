name: Python checks

on:
  # Feature branches are validated by their pull_request event. Running both
  # push and pull_request checks for each feature commit created duplicate runs.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile oci_free_watch.py
      - run: bash -n oci-free
      - run: bash -n install.sh
      - run: test -x oci-free
      - run: python -m unittest discover -s tests -v
